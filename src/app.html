<title>Chores Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: navy header band → tab bar → one working column (max 1080px) → tonal teal wave footer.
   Palette and type follow the Mizala design system: teal brand, indigo navy, grey-white surfaces, Segoe UI. */
:root {
  --brand: #41b883;        /* Mizala teal: fills, bands, chips (dark text on top) */
  --brand-sea: #58c091;
  --brand-mist: #c6e8d8;
  --brand-ink: #1d7550;    /* teal dark enough for text on white */
  --navy: #1e3a5f;         /* header/footer, primary buttons */
  --complement: #35495e;
  --coral: #ff6b6d;
  --yellow: #ffd166;
  --purple: #8e44ad;
  --page: #ffffff;
  --raised: #f2f2f2;
  --card: #ffffff;
  --ink: #2c3e50;
  --heading: #020202;
  --body: #383838;
  --muted: #5a6878;
  --line: #dde2e7;
  --on-navy: #ffffff;
  --on-navy-muted: #c6d3e2;
  --ok-bg: #d9f1e5;  --ok-fg: #17603f;
  --warn-bg: #fff1c9; --warn-fg: #6e4f00;
  --bad-bg: #ffe2e2;  --bad-fg: #a1282b;
  --focus: #1e3a5f;
  --shadow: 0 1px 2px rgba(30,58,95,.08), 0 6px 20px rgba(30,58,95,.08);
  --font: "Segoe UI", "Segoe UI Variable", -apple-system, BlinkMacSystemFont, Tahoma, Geneva, Verdana, sans-serif;
  --r-sm: 8px; --r-md: 16px; --r-lg: 28px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --brand: #41b883; --brand-sea: #7fe3b4; --brand-mist: #dff5ea; --brand-ink: #7fe3b4;
  --navy: #335f8c; --complement: #4a6178; --coral: #ff8385; --yellow: #ffd166; --purple: #a569bd;
  --page: #12213a; --raised: #1c2f4d; --card: #172a45; --ink: #f2f2f2; --heading: #ffffff; --body: #cbd5e0;
  --muted: #9fb0c4; --line: #2b4366; --on-navy: #ffffff; --on-navy-muted: #c9d8ea;
  --ok-bg: #1b4a39; --ok-fg: #bff0d6; --warn-bg: #4a3c12; --warn-fg: #ffe39a; --bad-bg: #4f2026; --bad-fg: #ffc4c5;
  --focus: #7fe3b4; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --brand: #41b883; --brand-sea: #7fe3b4; --brand-mist: #dff5ea; --brand-ink: #7fe3b4;
  --navy: #335f8c; --complement: #4a6178; --coral: #ff8385; --yellow: #ffd166; --purple: #a569bd;
  --page: #12213a; --raised: #1c2f4d; --card: #172a45; --ink: #f2f2f2; --heading: #ffffff; --body: #cbd5e0;
  --muted: #9fb0c4; --line: #2b4366; --on-navy: #ffffff; --on-navy-muted: #c9d8ea;
  --ok-bg: #1b4a39; --ok-fg: #bff0d6; --warn-bg: #4a3c12; --warn-fg: #ffe39a; --bad-bg: #4f2026; --bad-fg: #ffc4c5;
  --focus: #7fe3b4; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--body); font: 400 16px/24px var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { color: var(--heading); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 36px; font-weight: 700; }
h2 { font-size: 18px; line-height: 24px; font-weight: 700; }
h3 { font-size: 16px; line-height: 22px; font-weight: 700; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.cap { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); }
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { background: var(--navy); color: var(--on-navy); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }
.mark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark-badge { width: 40px; height: 40px; border-radius: 12px; background: var(--brand); display: grid; place-items: center; flex: none; }
.mark b { display: block; font-size: 18px; line-height: 22px; color: var(--on-navy); }
.mark span { display: block; font-size: 13px; line-height: 18px; color: var(--on-navy-muted); }
.me { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); color: var(--on-navy); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; }
.me:hover { background: rgba(255,255,255,.18); }
.me small { color: var(--on-navy-muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; color: var(--on-navy-muted); text-decoration: none; font-weight: 600; border-bottom: 3px solid transparent; }
.tab:hover { color: var(--on-navy); }
.tab[aria-current="page"] { color: var(--on-navy); border-bottom-color: var(--brand); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--yellow); color: #3b2c00; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }

main { padding-block: 28px 40px; min-height: 60vh; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.page-head p { margin-top: 4px; }
.stack { display: grid; gap: 20px; }

/* Avatars */
.av { --c: var(--brand); --t: #08261a; width: 32px; height: 32px; border-radius: 50%; background: var(--c); color: var(--t); display: inline-grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.av.lg { width: 64px; height: 64px; font-size: 22px; }
.av.sm { width: 24px; height: 24px; font-size: 11px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: var(--r-sm); border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.primary { background: var(--navy); color: var(--on-navy); }
.btn.primary:hover { filter: brightness(1.12); }
.btn.go { background: var(--brand); color: #04281a; }
.btn.go:hover { background: var(--brand-sea); }
.btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { background: var(--raised); }
.btn.warn { background: transparent; border-color: var(--bad-fg); color: var(--bad-fg); }
.btn.warn:hover { background: var(--bad-bg); }
.btn.sm { min-height: 32px; padding: 4px 10px; font-size: 14px; }
.btn.icon { min-height: 32px; width: 32px; padding: 0; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--brand-ink); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Panels */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; }
.panel.flat { background: var(--raised); border-color: transparent; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat { background: var(--raised); border-radius: var(--r-md); padding: 14px 16px; }
.stat b { display: block; font-size: 24px; line-height: 30px; color: var(--heading); font-variant-numeric: tabular-nums; margin-top: 2px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; line-height: 20px; white-space: nowrap; }
.pill.submitted { background: var(--warn-bg); color: var(--warn-fg); }
.pill.approved { background: var(--ok-bg); color: var(--ok-fg); }
.pill.rejected { background: var(--bad-bg); color: var(--bad-fg); }
.pill.neutral { background: var(--raised); color: var(--muted); }

/* Picker */
.who { display: grid; gap: 28px; max-width: 760px; margin: 0 auto; padding-top: 12px; }
.who-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.who-btn { display: grid; justify-items: center; gap: 10px; padding: 20px 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); cursor: pointer; }
.who-btn:hover { border-color: var(--brand); box-shadow: var(--shadow); }
.who-btn b { color: var(--heading); font-size: 17px; }

/* Week bar */
.weekbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.weekbar .range { font-weight: 700; color: var(--heading); min-width: 0; padding: 0 6px; }
.kidchips { display: flex; flex-wrap: wrap; gap: 8px; }
.kidchip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; color: var(--ink); }
.kidchip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }

/* Timesheet days */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.day { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); display: flex; flex-direction: column; min-width: 0; }
.day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.day.future { opacity: .75; }
.day > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.day > header b { color: var(--heading); }
.day-body { padding: 12px 16px 14px; display: grid; gap: 10px; flex: 1; align-content: start; }
.plan { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; background: var(--raised); border-radius: var(--r-sm); font-size: 14px; color: var(--ink); }
.plan-chip.mine { background: color-mix(in srgb, var(--brand) 22%, var(--card)); }
.plan-chip.done { text-decoration: line-through; opacity: .7; }
.plan-chip button { border: 0; background: var(--navy); color: var(--on-navy); border-radius: 6px; font-size: 12px; font-weight: 700; padding: 2px 8px; cursor: pointer; }
.entries { display: grid; gap: 6px; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border-radius: var(--r-sm); background: var(--raised); }
.entry .what { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.entry .amt { font-weight: 700; color: var(--heading); text-align: right; font-variant-numeric: tabular-nums; }
.entry .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); }
.entry .acts { margin-left: auto; display: flex; gap: 6px; }
.add-line { justify-self: start; }
.empty-note { font-size: 14px; color: var(--muted); }
.weektotal { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; align-items: center; padding: 16px 20px; background: var(--navy); color: var(--on-navy); border-radius: var(--r-md); }
.weektotal b { font-size: 20px; font-variant-numeric: tabular-nums; }
.weektotal span { color: var(--on-navy-muted); }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--raised); white-space: nowrap; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 700; color: var(--heading); background: var(--raised); }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--brand) 8%, var(--card)); }
.task { font-weight: 600; color: var(--heading); }
.daydots { display: inline-flex; gap: 3px; }
.daydots i { width: 18px; height: 18px; border-radius: 5px; background: var(--raised); color: var(--muted); font-style: normal; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.daydots i.on { background: var(--brand); color: #04281a; }

/* Rate card (mirrors the spreadsheet's /month /Wk /Hr cells) */
.rate { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: var(--r-md); overflow: hidden; background: var(--navy); color: var(--on-navy); }
.rate > div { padding: 16px 18px; border-right: 1px solid rgba(255,255,255,.15); min-width: 0; }
.rate > div:last-child { border-right: 0; background: var(--brand); color: #04281a; }
.rate small { display: block; font-size: 13px; font-weight: 600; opacity: .85; }
.rate b { display: block; font-size: 26px; line-height: 32px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meter { height: 10px; background: var(--raised); border-radius: 999px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
.meter.over > i { background: var(--coral); }

/* Schedule */
.sched td, .sched th { padding: 8px; text-align: center; }
.sched td:first-child, .sched th:first-child { text-align: left; padding-left: 14px; min-width: 150px; }
.sched th.today { background: color-mix(in srgb, var(--brand) 30%, var(--raised)); color: var(--heading); }
.slot { min-width: 84px; min-height: 36px; border-radius: var(--r-sm); border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: default; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 4px 8px; }
.slot.on { border: 0; background: var(--raised); color: var(--ink); }
.slot.kid { border: 0; background: var(--c); color: var(--t); }
.slot.mine { outline: 2px solid var(--heading); outline-offset: 1px; }
button.slot { cursor: pointer; }
button.slot:not(.on):not(.kid):hover { border-color: var(--brand); color: var(--brand-ink); }
.loads { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 10px; }
.load { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--raised); border-radius: var(--r-md); }
.load div { min-width: 0; }
.load b { display: block; color: var(--heading); }

/* Balances */
.kids { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.kidcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; display: flex; flex-direction: column; }
.kidcard > header { display: flex; align-items: center; gap: 12px; padding: 16px 18px; }
.kidcard > header h2 { flex: 1; }
.owed { padding: 0 18px 14px; }
.owed b { display: block; font-size: 34px; line-height: 40px; color: var(--heading); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-weight: 600; color: var(--ink); }
.kidcard footer { margin-top: auto; padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }

/* Empty / loading */
.empty { text-align: center; padding: 40px 20px; background: var(--raised); border-radius: var(--r-lg); display: grid; justify-items: center; gap: 10px; }
.empty p { max-width: 46ch; }
.loading { display: grid; justify-items: center; gap: 12px; padding: 60px 0; color: var(--muted); }
.spin { width: 28px; height: 28px; border: 3px solid var(--brand-mist); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(8,20,36,.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 50; }
.sheet { width: min(100%, 520px); max-height: 100%; overflow-y: auto; background: var(--card); border-radius: var(--r-md); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.sheet > header { padding: 18px 20px 0; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.sheet form, .sheet .sheet-body { padding: 16px 20px 20px; display: grid; gap: 16px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 14px; font-weight: 600; color: var(--ink); }
.field small { color: var(--muted); font-size: 13px; }
input[type="text"], input[type="number"], input[type="password"], input[type="date"], select, textarea { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--page); }
textarea { min-height: 70px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); }
.daypick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.daypick label { display: grid; place-items: center; padding: 8px 0; border-radius: var(--r-sm); border: 1px solid var(--line); cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink); }
.daypick input { position: absolute; opacity: 0; pointer-events: none; }
.daypick label:has(input:checked) { background: var(--brand); border-color: var(--brand); color: #04281a; }
.daypick label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--raised); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--heading); box-shadow: var(--shadow); }
.preview { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--raised); font-variant-numeric: tabular-nums; }
.preview b { font-size: 20px; color: var(--heading); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.sheet-actions .left { margin-right: auto; }
.optlist { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; font-weight: 600; color: var(--ink); }
.opt:hover { border-color: var(--brand); }
.opt[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.pin { letter-spacing: .5em; text-align: center; font-size: 22px; }
.err { color: var(--bad-fg); font-size: 14px; font-weight: 600; }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--heading); color: var(--page); padding: 10px 18px; border-radius: 14px; text-align: center; font-weight: 600; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

/* Footer: Mizala wave motif as a closing band */
.foot { margin-top: 24px; }
.foot svg { display: block; width: 100%; height: 48px; }
.foot-bar { background: var(--navy); color: var(--on-navy-muted); }
.foot-in { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding-block: 14px; font-size: 13px; font-weight: 500; }
.sync { display: inline-flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.sync.local i { background: var(--yellow); }

@media (max-width: 560px) {
  h1 { font-size: 24px; line-height: 30px; }
  .rate b { font-size: 20px; line-height: 26px; }
  .rate > div { padding: 12px; }
  .mark span { display: none; }
  .me small { display: none; }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
</style>

<header class="top">
  <div class="wrap top-in">
    <div class="mark">
      <div class="mark-badge" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#04281a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
      </div>
      <div><b>Chores Manager</b><span>Family chores, hours &amp; pay</span></div>
    </div>
    <div id="me-slot"></div>
  </div>
  <nav class="wrap tabs" id="tabs" aria-label="Sections"></nav>
</header>

<main class="wrap" id="main">
  <div class="loading"><div class="spin" aria-hidden="true"></div><p>Loading the family's chores…</p></div>
</main>

<footer class="foot" aria-hidden="false">
  <svg viewBox="0 0 1200 48" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 22 C150 6 300 6 450 20 S750 36 900 20 S1100 6 1200 16 V48 H0Z" fill="var(--brand-mist)"/>
    <path d="M0 30 C180 16 330 18 480 30 S780 44 960 30 S1120 18 1200 26 V48 H0Z" fill="var(--brand-sea)"/>
    <path d="M0 38 C200 28 360 30 520 38 S820 48 1000 38 S1140 30 1200 36 V48 H0Z" fill="var(--brand)"/>
  </svg>
  <div class="foot-bar"><div class="wrap foot-in"><span id="foot-date"></span><span id="foot-sync"></span></div></div>
</footer>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
'use strict';

/* ---------- Family ---------- */
const FAMILY = [
  { id: 'mother',   name: 'Mother',   role: 'parent', c: 'var(--navy)',       t: '#ffffff' },
  { id: 'father',   name: 'Father',   role: 'parent', c: 'var(--complement)', t: '#ffffff' },
  { id: 'mustafa',  name: 'Mustafa',  role: 'child',  c: '#41b883', t: '#04281a' },
  { id: 'ayesha',   name: 'Ayesha',   role: 'child',  c: '#ff6b6d', t: '#3a0708' },
  { id: 'aaminah',  name: 'Aaminah',  role: 'child',  c: '#8e44ad', t: '#ffffff' },
  { id: 'mohammad', name: 'Mohammad', role: 'child',  c: '#ffd166', t: '#3b2c00' },
];
const KIDS = FAMILY.filter(m => m.role === 'child');
const member = id => FAMILY.find(m => m.id === id);
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DAYS_LONG = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const FREQ = {
  'Daily': [0, 1, 2, 3, 4, 5, 6],
  'Alternate day': [0, 2, 4, 6],
  'Twice weekly': [1, 4],
  'Once weekly': [5],
};
const DEFAULT_SETTINGS = { monthlyBudget: 1500, budgetHours: 40, rateMode: 'budget', manualRate: 8.65, currency: '', parentPin: '' };
// The four chores from the family's spreadsheet. Used to start a new store when a parent asks for it,
// and to start the device-only copy when the shared store is not available.
const STARTER = [
  { id: 'car-wash',   name: 'Car Wash & Cleaning', hoursPerWeek: 3,   frequency: 'Once weekly' },
  { id: 'gardening',  name: 'Gardening',           hoursPerWeek: 8,   frequency: 'Alternate day' },
  { id: 'clean-pool', name: 'Clean Pool',          hoursPerWeek: 8,   frequency: 'Alternate day' },
  { id: 'cat-litter', name: 'Cat Litter',          hoursPerWeek: 1.5, frequency: 'Alternate day' },
];

/* ---------- Helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const weekOf = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const dayIdx = s => (parse(s).getDay() + 6) % 7;
const today = () => iso(new Date());
const fmtDay = s => parse(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtDate = s => parse(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtRange = w => `${parse(w).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} – ${fmtDate(addDays(w, 6))}`;
const r2 = n => Math.round((+n || 0) * 100) / 100;
const num = n => (+n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = n => { const c = (S.settings.currency || '').trim(); return c ? `${c} ${num(n)}` : num(n); };
const dur = m => { m = Math.round(+m || 0); const h = Math.floor(m / 60), mm = m % 60; return h ? `${h}h ${pad(mm)}m` : `${mm}m`; };
const hrs = h => (Math.round((+h || 0) * 100) / 100).toLocaleString('en-GB', { maximumFractionDigits: 2 });
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const avatar = (m, size = '') => m ? `<span class="av ${size}" style="--c:${m.c};--t:${m.t}" aria-hidden="true">${esc(m.name.slice(0, 1))}</span>` : '';
const sameDays = (a, b) => a.length === b.length && a.every((v, i) => v === b[i]);
const freqFor = days => { const s = [...days].sort(); for (const k in FREQ) if (sameDays(FREQ[k], s)) return k; return 'Custom'; };

/* ---------- State ---------- */
const S = {
  mode: 'connecting',             // 'db' (shared with family) | 'local' (this device only)
  settings: { ...DEFAULT_SETTINGS },
  chores: {}, sheets: {}, payments: {},
  loaded: { settings: false, chores: false, sheets: false, payments: false },
};
const UI = { me: lsGet('cm-me'), week: weekOf(today()), kid: null, showArchived: false };
let DB = null;
const LKEY = 'chores-manager-data-v1';

const ready = () => S.mode === 'local' || (S.mode === 'db' && Object.values(S.loaded).every(Boolean));
const me = () => member(UI.me);
const isParent = () => me() && me().role === 'parent';

/* ---------- Derived numbers ---------- */
const weeklyBudget = () => r2((+S.settings.monthlyBudget || 0) * 12 / 52);
const familyRate = () => S.settings.rateMode === 'manual'
  ? +S.settings.manualRate || 0
  : ((+S.settings.budgetHours || 0) > 0 ? (+S.settings.monthlyBudget || 0) * 12 / 52 / +S.settings.budgetHours : 0);
const choreRate = c => (c && +c.rate > 0) ? +c.rate : familyRate();
const activeChores = () => Object.entries(S.chores).map(([id, c]) => ({ id, ...c })).filter(c => c.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0) || a.name.localeCompare(b.name));
const archivedChores = () => Object.entries(S.chores).map(([id, c]) => ({ id, ...c })).filter(c => c.active === false);
const sessionMins = c => (c.days && c.days.length) ? Math.round((+c.hoursPerWeek || 0) * 60 / c.days.length / 5) * 5 : 0;
const allEntries = () => {
  const out = [];
  for (const [sid, sh] of Object.entries(S.sheets)) {
    const es = (sh && sh.entries) || {};
    for (const [eid, e] of Object.entries(es)) if (e && e.status !== 'deleted') out.push({ sid, eid, childId: sh.childId, week: sh.week, ...e });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date) || String(a.createdAt).localeCompare(String(b.createdAt)));
};
const totals = kid => {
  const es = allEntries().filter(e => e.childId === kid);
  const sum = (arr, k) => r2(arr.reduce((s, x) => s + (+x[k] || 0), 0));
  const approved = es.filter(e => e.status === 'approved');
  const pending = es.filter(e => e.status === 'submitted');
  const pays = Object.values(S.payments).filter(p => p && p.childId === kid);
  const earned = sum(approved, 'amount'), paid = sum(pays, 'amount');
  return { earned, paid, balance: r2(earned - paid), pending: sum(pending, 'amount'), pendingCount: pending.length, approvedMins: sum(approved, 'minutes') };
};

/* ---------- Storage (shared db when available, otherwise this device) ---------- */
function saveLocal() {
  if (S.mode !== 'local') return;
  lsSet(LKEY, JSON.stringify({ settings: S.settings, chores: S.chores, sheets: S.sheets, payments: S.payments }));
}
function starterChores() {
  const out = {};
  STARTER.forEach((c, i) => { out[c.id] = { name: c.name, hoursPerWeek: c.hoursPerWeek, frequency: c.frequency, days: FREQ[c.frequency].slice(), assign: {}, rate: null, active: true, order: i + 1 }; });
  return out;
}
function startLocal() {
  S.mode = 'local';
  const raw = lsGet(LKEY);
  let data = null;
  if (raw) { try { data = JSON.parse(raw); } catch (e) {} }
  if (data) {
    S.settings = { ...DEFAULT_SETTINGS, ...(data.settings || {}) };
    S.chores = data.chores || {}; S.sheets = data.sheets || {}; S.payments = data.payments || {};
  } else {
    S.settings = { ...DEFAULT_SETTINGS }; S.chores = starterChores(); saveLocal();
  }
  render();
}
function onDbError(e) {
  if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) toast('The shared family data is not available right now.');
}
function startDb(db) {
  DB = db; S.mode = 'db';
  const docsToMap = q => { const o = {}; q.docs.forEach(d => { o[d.id] = d.data(); }); return o; };
  db.doc('app/settings').onSnapshot(s => { S.settings = { ...DEFAULT_SETTINGS, ...(s.exists ? s.data() : {}) }; S.loaded.settings = true; render(); }, onDbError);
  db.collection('chores').onSnapshot(q => { S.chores = docsToMap(q); S.loaded.chores = true; render(); }, onDbError);
  db.collection('timesheets').limit(1000).onSnapshot(q => { S.sheets = docsToMap(q); S.loaded.sheets = true; render(); }, onDbError);
  db.collection('payments').limit(1000).onSnapshot(q => { S.payments = docsToMap(q); S.loaded.payments = true; render(); }, onDbError);
  render();
}
async function boot() {
  render();
  let db = null;
  try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch (e) { db = null; }
  if (db) startDb(db); else startLocal();
}

async function save(fn) {
  try { await fn(); if (S.mode === 'local') { saveLocal(); render(); } return true; }
  catch (e) {
    const code = e && e.code;
    toast(code === 'quota_exceeded' ? 'Storage is full. Ask a parent to clear old records.' : 'That did not save. Check the connection and try again.');
    return false;
  }
}
const ops = {
  setSettings: patch => save(async () => {
    const next = { ...S.settings, ...patch };
    if (S.mode === 'db') await DB.doc('app/settings').set(next); else S.settings = next;
  }),
  putChore: (id, data) => save(async () => {
    if (S.mode === 'db') await DB.doc('chores/' + id).set(data); else S.chores = { ...S.chores, [id]: data };
  }),
  seedChores: () => save(async () => {
    const all = starterChores();
    if (S.mode === 'db') {
      if (!S.loaded.settings || !Object.keys(S.settings).length) await DB.doc('app/settings').set({ ...S.settings });
      for (const [id, c] of Object.entries(all)) await DB.doc('chores/' + id).set(c);
    } else S.chores = { ...S.chores, ...all };
  }),
  putEntry: (childId, week, eid, entry) => save(async () => {
    const sid = childId + '_' + week;
    if (S.mode === 'db') {
      const ref = DB.doc('timesheets/' + sid);
      const snap = await ref.get();
      if (snap.exists) await ref.update({ entries: { [eid]: entry } });
      else await ref.set({ childId, week, entries: { [eid]: entry } });
    } else {
      const sh = S.sheets[sid] || { childId, week, entries: {} };
      S.sheets = { ...S.sheets, [sid]: { ...sh, entries: { ...sh.entries, [eid]: entry } } };
    }
  }),
  patchEntry: (sid, eid, patch) => save(async () => {
    if (S.mode === 'db') await DB.doc('timesheets/' + sid).update({ entries: { [eid]: patch } });
    else { const sh = S.sheets[sid]; S.sheets = { ...S.sheets, [sid]: { ...sh, entries: { ...sh.entries, [eid]: { ...sh.entries[eid], ...patch } } } }; }
  }),
  removeEntry: (sid, eid) => save(async () => {
    if (S.mode === 'db') await DB.doc('timesheets/' + sid).update({ entries: { [eid]: null } });
    else { const sh = S.sheets[sid]; const es = { ...sh.entries }; delete es[eid]; S.sheets = { ...S.sheets, [sid]: { ...sh, entries: es } }; }
  }),
  putPayment: (id, data) => save(async () => {
    if (S.mode === 'db') await DB.doc('payments/' + id).set(data); else S.payments = { ...S.payments, [id]: data };
  }),
  patchPayment: (id, patch) => save(async () => {
    if (S.mode === 'db') await DB.doc('payments/' + id).update(patch); else S.payments = { ...S.payments, [id]: { ...S.payments[id], ...patch } };
  }),
  removePayment: id => save(async () => {
    if (S.mode === 'db') await DB.doc('payments/' + id).delete(); else { const p = { ...S.payments }; delete p[id]; S.payments = p; }
  }),
};

/* ---------- Routing ---------- */
const VIEWS = {
  parent: [['approvals', 'Approvals'], ['timesheets', 'Timesheets'], ['schedule', 'Schedule'], ['chores', 'Chores & pay'], ['balances', 'Balances']],
  child:  [['my-week', 'My week'], ['schedule', 'Schedule'], ['chores', 'Chores & pay'], ['balance', 'My balance']],
};
function currentView() {
  const m = me(); if (!m) return 'who';
  const list = VIEWS[m.role].map(v => v[0]);
  const h = (location.hash || '').slice(1);
  return list.includes(h) ? h : list[0];
}

/* ---------- Render ---------- */
function render() {
  $('#foot-date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('#foot-sync').innerHTML = S.mode === 'db'
    ? '<span class="sync"><i></i>Shared with the family · updates live</span>'
    : S.mode === 'local' ? '<span class="sync local"><i></i>Saved on this device only</span>' : '';
  const m = me();
  $('#me-slot').innerHTML = m ? `<button class="me" data-act="switch" aria-label="Switch user, signed in as ${esc(m.name)}">${avatar(m)}<span>${esc(m.name)}</span><small>Switch</small></button>` : '';
  const view = currentView();
  const pend = allEntries().filter(e => e.status === 'submitted').length;
  $('#tabs').innerHTML = m ? VIEWS[m.role].map(([id, label]) =>
    `<a class="tab" href="#${id}" ${id === view ? 'aria-current="page"' : ''}>${label}${id === 'approvals' && pend ? `<span class="count">${pend}</span>` : ''}</a>`).join('') : '';
  const main = $('#main');
  if (!ready()) { main.innerHTML = '<div class="loading"><div class="spin" aria-hidden="true"></div><p>Loading the family\'s chores…</p></div>'; return; }
  const fn = { who: viewWho, approvals: viewApprovals, timesheets: viewTimesheets, 'my-week': viewMyWeek, schedule: viewSchedule, chores: viewChores, balances: viewBalances, balance: viewBalances }[view];
  main.innerHTML = fn();
}

function viewWho() {
  const btn = m => `<button class="who-btn" data-act="pick" data-id="${m.id}">${avatar(m, 'lg')}<b>${esc(m.name)}</b><span class="cap">${m.role === 'parent' ? 'Approves time & pays' : 'Logs chore time'}</span></button>`;
  return `<div class="who">
    <div><h1>Who's using the app?</h1><p class="muted" style="margin-top:6px">Pick your name. This device remembers you until you switch.</p></div>
    <section class="stack"><h2>Parents</h2><div class="who-grid">${FAMILY.filter(m => m.role === 'parent').map(btn).join('')}</div></section>
    <section class="stack"><h2>Children</h2><div class="who-grid">${KIDS.map(btn).join('')}</div></section>
  </div>`;
}

/* Timesheet for one child and one week */
function timesheet(kid, editable) {
  const w = UI.week, t = today();
  const es = allEntries().filter(e => e.childId === kid && e.week === w);
  const chores = activeChores();
  const parent = isParent();
  const wkMins = es.filter(e => e.status !== 'rejected').reduce((s, e) => s + (+e.minutes || 0), 0);
  const wkApproved = r2(es.filter(e => e.status === 'approved').reduce((s, e) => s + e.amount, 0));
  const wkPending = r2(es.filter(e => e.status === 'submitted').reduce((s, e) => s + e.amount, 0));
  const wkAll = r2(wkApproved + wkPending);
  const plannedMins = chores.reduce((s, c) => s + (c.days || []).filter(d => (c.assign || {})[d] === kid).length * sessionMins(c), 0);

  const days = DAYS.map((d, i) => {
    const date = addDays(w, i), future = date > t;
    const dayEntries = es.filter(e => e.date === date);
    const planned = chores.filter(c => (c.days || []).includes(i) && (!(c.assign || {})[i] || c.assign[i] === kid));
    const doneIds = new Set(dayEntries.filter(e => e.status !== 'rejected').map(e => e.choreId));
    const mins = dayEntries.filter(e => e.status !== 'rejected').reduce((s, e) => s + (+e.minutes || 0), 0);
    const canLog = editable && (!future || parent);
    const plan = planned.length ? `<div class="plan">${planned.map(c => {
      const mine = (c.assign || {})[i] === kid, done = doneIds.has(c.id);
      return `<span class="plan-chip ${mine ? 'mine' : ''} ${done ? 'done' : ''}" title="${mine ? 'Assigned to ' + esc(member(kid).name) : 'Anyone can do this'}">${esc(c.name)} · ${dur(sessionMins(c))}${canLog && !done ? ` <button data-act="log" data-chore="${c.id}" data-date="${date}" aria-label="Log ${esc(c.name)} on ${fmtDay(date)}">Log</button>` : ''}</span>`;
    }).join('')}</div>` : '';
    const list = dayEntries.length ? `<div class="entries">${dayEntries.map(e => entryRow(e, editable)).join('')}</div>` : '';
    return `<article class="day ${date === t ? 'today' : ''} ${future ? 'future' : ''}">
      <header><b>${DAYS_LONG[i]} <span class="muted" style="font-weight:500">${parse(date).getDate()} ${parse(date).toLocaleDateString('en-GB', { month: 'short' })}</span></b><span class="cap num">${mins ? dur(mins) : (date === t ? 'Today' : '')}</span></header>
      <div class="day-body">
        ${plan || (dayEntries.length ? '' : '<p class="empty-note">No chores planned.</p>')}
        ${list}
        ${canLog ? `<button class="link add-line" data-act="add-entry" data-date="${date}">+ Add chore time</button>` : (future && editable ? '<p class="empty-note">You can log this day once it arrives.</p>' : '')}
      </div>
    </article>`;
  }).join('');

  return `
    <div class="weekbar">
      <button class="btn ghost icon" data-act="week" data-step="-1" aria-label="Previous week">‹</button>
      <span class="range num">${fmtRange(w)}</span>
      <button class="btn ghost icon" data-act="week" data-step="1" aria-label="Next week">›</button>
      ${w !== weekOf(t) ? '<button class="btn ghost sm" data-act="week" data-step="0">This week</button>' : ''}
    </div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Hours logged</span><b>${dur(wkMins)}</b><span class="cap">Planned ${dur(plannedMins)}</span></div>
      <div class="stat"><span class="eyebrow">Approved</span><b>${money(wkApproved)}</b><span class="cap">Counts toward balance</span></div>
      <div class="stat"><span class="eyebrow">Awaiting approval</span><b>${money(wkPending)}</b><span class="cap">${es.filter(e => e.status === 'submitted').length} entries</span></div>
      <div class="stat"><span class="eyebrow">Pay rate</span><b>${money(familyRate())}</b><span class="cap">per hour</span></div>
    </div>
    <div class="days">${days}</div>
    <div class="weektotal"><span>Week total for ${esc(member(kid).name)}</span><b>${dur(wkMins)} · ${money(wkAll)}</b></div>`;
}

function entryRow(e, editable) {
  const parent = isParent();
  const label = { submitted: 'Awaiting approval', approved: 'Approved', rejected: 'Not approved' }[e.status] || e.status;
  let acts = '';
  if (parent && e.status === 'submitted') acts = `<button class="btn go sm" data-act="approve" data-sid="${e.sid}" data-eid="${e.eid}">Approve</button><button class="btn warn sm" data-act="reject" data-sid="${e.sid}" data-eid="${e.eid}">Reject</button>`;
  if (editable && (parent || e.status !== 'approved')) acts += `<button class="btn ghost sm" data-act="edit-entry" data-sid="${e.sid}" data-eid="${e.eid}">Edit</button>`;
  return `<div class="entry">
    <span class="what">${esc(e.choreName)}</span><span class="amt">${money(e.amount)}</span>
    <div class="meta"><span class="num">${dur(e.minutes)} × ${money(e.rate)}/hr</span><span class="pill ${esc(e.status)}">${label}</span>${e.note ? `<span>“${esc(e.note)}”</span>` : ''}<span class="acts">${acts}</span></div>
  </div>`;
}

function viewMyWeek() {
  const m = me();
  return `<div class="page-head"><div><h1>${esc(m.name)}'s timesheet</h1><p class="muted">Log the time you spend on each chore. Mother or Father approve it, then it's added to your balance.</p></div>
    <button class="btn primary" data-act="add-entry">+ Log chore time</button></div>
    <div class="stack">${timesheet(m.id, true)}</div>`;
}

function viewTimesheets() {
  if (!UI.kid) UI.kid = KIDS[0].id;
  const kid = UI.kid;
  return `<div class="page-head"><div><h1>Timesheets</h1><p class="muted">Each child's week. Approve entries here or on the Approvals tab. Time you add yourself is approved straight away.</p></div></div>
    <div class="stack">
      <div class="kidchips" role="group" aria-label="Choose a child">${KIDS.map(k => {
        const p = allEntries().filter(e => e.childId === k.id && e.status === 'submitted').length;
        return `<button class="kidchip" data-act="kid" data-id="${k.id}" aria-pressed="${k.id === kid}">${avatar(k)}${esc(k.name)}${p ? ` <span class="count">${p}</span>` : ''}</button>`;
      }).join('')}</div>
      ${timesheet(kid, true)}
    </div>`;
}

function viewApprovals() {
  const pend = allEntries().filter(e => e.status === 'submitted');
  const recent = allEntries().filter(e => e.status !== 'submitted' && e.reviewedAt).sort((a, b) => String(b.reviewedAt).localeCompare(String(a.reviewedAt))).slice(0, 8);
  const groups = KIDS.map(k => ({ k, es: pend.filter(e => e.childId === k.id) })).filter(g => g.es.length);
  const head = `<div class="page-head"><div><h1>Approvals</h1><p class="muted">Check the time each child has logged. Approved time is added to their balance at the pay rate shown.</p></div></div>`;
  const body = groups.length ? groups.map(({ k, es }) => {
    const total = r2(es.reduce((s, e) => s + e.amount, 0)), mins = es.reduce((s, e) => s + e.minutes, 0);
    return `<section class="panel">
      <div class="panel-head"><div style="display:flex;align-items:center;gap:10px">${avatar(k)}<div><h2>${esc(k.name)}</h2><span class="cap num">${es.length} entr${es.length === 1 ? 'y' : 'ies'} · ${dur(mins)} · ${money(total)}</span></div></div>
        <button class="btn go" data-act="approve-all" data-id="${k.id}">Approve all (${es.length})</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Day</th><th>Chore</th><th class="r">Time</th><th class="r">Pay</th><th></th></tr></thead><tbody>
      ${es.map(e => `<tr><td>${fmtDay(e.date)}</td><td><span class="task">${esc(e.choreName)}</span>${e.note ? `<br><span class="cap">“${esc(e.note)}”</span>` : ''}</td><td class="r">${dur(e.minutes)}</td><td class="r">${money(e.amount)}</td>
        <td class="r" style="white-space:nowrap"><button class="btn go sm" data-act="approve" data-sid="${e.sid}" data-eid="${e.eid}">Approve</button> <button class="btn warn sm" data-act="reject" data-sid="${e.sid}" data-eid="${e.eid}">Reject</button> <button class="btn ghost sm" data-act="edit-entry" data-sid="${e.sid}" data-eid="${e.eid}">Edit</button></td></tr>`).join('')}
      </tbody></table></div></section>`;
  }).join('') : `<div class="empty"><h2>Nothing waiting for approval</h2><p class="muted">When a child logs chore time it shows up here for Mother or Father to approve.</p></div>`;
  const rec = recent.length ? `<section class="panel flat"><div class="panel-head"><h2>Recently reviewed</h2></div><div class="entries">${recent.map(e => `<div class="entry"><span class="what">${esc(member(e.childId).name)} · ${esc(e.choreName)}</span><span class="amt">${money(e.amount)}</span><div class="meta"><span>${fmtDay(e.date)} · ${dur(e.minutes)}</span><span class="pill ${e.status}">${e.status === 'approved' ? 'Approved' : 'Not approved'}</span>${e.reviewedBy ? `<span>by ${esc((member(e.reviewedBy) || {}).name || '')}</span>` : ''}</div></div>`).join('')}</div></section>` : '';
  return head + `<div class="stack">${body}${rec}</div>`;
}

function viewChores() {
  const parent = isParent();
  const cs = activeChores();
  const rate = familyRate(), wb = weeklyBudget();
  const totalHrs = cs.reduce((s, c) => s + (+c.hoursPerWeek || 0), 0);
  const totalPay = r2(cs.reduce((s, c) => s + (+c.hoursPerWeek || 0) * choreRate(c), 0));
  const pct = wb > 0 ? Math.round(totalPay / wb * 100) : 0;
  const rateNote = S.settings.rateMode === 'manual'
    ? `Fixed hourly rate set by parents.`
    : `${money(S.settings.monthlyBudget)} a month × 12 ÷ 52 weeks = ${money(wb)} a week, shared over ${hrs(S.settings.budgetHours)} budgeted hours.`;
  const table = cs.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>Task</th><th class="r">Hrs/wk</th><th class="r">Wk payment</th><th>Activity</th><th>Days</th><th>Assigned</th></tr></thead>
    <tbody>${cs.map(c => {
      const who = [...new Set(Object.values(c.assign || {}).filter(Boolean))].map(member).filter(Boolean);
      return `<tr ${parent ? `class="click" data-act="edit-chore" data-id="${c.id}" tabindex="0"` : ''}>
      <td><span class="task">${esc(c.name)}</span>${+c.rate > 0 ? `<br><span class="cap">Own rate ${money(c.rate)}/hr</span>` : ''}</td>
      <td class="r">${hrs(c.hoursPerWeek)}</td><td class="r">${money((+c.hoursPerWeek || 0) * choreRate(c))}</td>
      <td>${esc(c.frequency || freqFor(c.days || []))}<br><span class="cap">${dur(sessionMins(c))} a session</span></td>
      <td><span class="daydots" aria-label="${(c.days || []).map(d => DAYS[d]).join(', ')}">${DAYS.map((d, i) => `<i class="${(c.days || []).includes(i) ? 'on' : ''}">${d[0]}</i>`).join('')}</span></td>
      <td>${who.length ? `<span style="display:inline-flex;gap:3px">${who.map(m => avatar(m, 'sm')).join('')}</span>` : '<span class="cap">Anyone</span>'}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${hrs(totalHrs)}</td><td class="r">${money(totalPay)}</td><td colspan="3"></td></tr></tfoot>
  </table></div>` : `<div class="empty"><h2>No chores yet</h2><p class="muted">${parent ? 'Add your first chore, or start with the four from the family spreadsheet: car wash, gardening, pool and cat litter.' : 'Mother or Father will add the chores here.'}</p>${parent ? '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="seed">Add the spreadsheet chores</button><button class="btn ghost" data-act="add-chore">+ New chore</button></div>' : ''}</div>`;
  const arch = archivedChores();
  const archived = parent && arch.length ? `<section class="panel flat"><div class="panel-head"><h2>Archived chores</h2><button class="link" data-act="toggle-arch">${UI.showArchived ? 'Hide' : `Show ${arch.length}`}</button></div>
    ${UI.showArchived ? `<div class="entries">${arch.map(c => `<div class="entry"><span class="what">${esc(c.name)}</span><span><button class="btn ghost sm" data-act="restore-chore" data-id="${c.id}">Restore</button></span></div>`).join('')}</div>` : ''}</section>` : '';
  return `<div class="page-head"><div><h1>Chores &amp; pay</h1><p class="muted">${parent ? 'Add chores, set the hours and days, and set the rate of pay. Tap a chore to change it.' : 'The family chores and what each one pays.'}</p></div>
      ${parent ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" data-act="edit-rate">Pay settings</button><button class="btn primary" data-act="add-chore">+ New chore</button></div>' : ''}</div>
    <div class="stack">
      <section class="stack" style="gap:10px">
        <div class="rate" aria-label="Pay rate">
          <div><small>/month</small><b>${num(S.settings.monthlyBudget)}</b></div>
          <div><small>/wk</small><b>${num(wb)}</b></div>
          <div><small>/hr</small><b>${num(rate)}</b></div>
        </div>
        <p class="cap">${esc(rateNote)}${S.settings.currency ? '' : ' Amounts have no currency symbol; parents can add one in Pay settings.'}</p>
      </section>
      ${cs.length ? `<section class="panel flat"><div class="panel-head"><h2>Planned chores vs weekly budget</h2><span class="num"><b style="color:var(--heading)">${money(totalPay)}</b> <span class="muted">of ${money(wb)} · ${hrs(totalHrs)} of ${hrs(S.settings.budgetHours)} hrs</span></span></div>
        <div class="meter ${pct > 100 ? 'over' : ''}" role="img" aria-label="${pct}% of the weekly budget planned"><i style="width:${Math.min(pct, 100)}%"></i></div>
        <p class="cap" style="margin-top:8px">${pct > 100 ? `Planned chores cost ${pct}% of the weekly budget.` : `${pct}% of the weekly budget is planned. ${money(r2(wb - totalPay))} a week is free for new chores.`}</p></section>` : ''}
      ${table}
      ${archived}
    </div>`;
}

function viewSchedule() {
  const parent = isParent(), m = me();
  const cs = activeChores();
  const t = today(), ti = dayIdx(t);
  const loads = KIDS.map(k => {
    let mins = 0, pay = 0;
    cs.forEach(c => (c.days || []).forEach(d => { if ((c.assign || {})[d] === k.id) { mins += sessionMins(c); pay += sessionMins(c) / 60 * choreRate(c); } }));
    return { k, mins, pay: r2(pay) };
  });
  let openMins = 0; cs.forEach(c => (c.days || []).forEach(d => { if (!(c.assign || {})[d]) openMins += sessionMins(c); }));
  const grid = cs.length ? `<div class="tbl-wrap"><table class="sched">
    <thead><tr><th>Chore</th>${DAYS.map((d, i) => `<th class="${i === ti ? 'today' : ''}">${d}</th>`).join('')}</tr></thead>
    <tbody>${cs.map(c => `<tr><td><span class="task">${esc(c.name)}</span><br><span class="cap">${dur(sessionMins(c))} a session</span></td>${DAYS.map((d, i) => {
      const on = (c.days || []).includes(i), who = on ? member((c.assign || {})[i]) : null;
      const inner = on ? (who ? `${esc(who.name)}` : 'Anyone') : (parent ? '+' : '');
      const cls = `slot ${on ? (who ? 'kid' : 'on') : ''} ${who && m && who.id === m.id ? 'mine' : ''}`;
      const style = who ? ` style="--c:${who.c};--t:${who.t}"` : '';
      const label = `${c.name}, ${DAYS_LONG[i]}: ${on ? (who ? who.name : 'anyone') : 'not scheduled'}`;
      return `<td>${parent ? `<button class="${cls}"${style} data-act="slot" data-id="${c.id}" data-day="${i}" aria-label="${esc(label)}. Change">${inner}</button>` : (on ? `<span class="${cls}"${style} aria-label="${esc(label)}">${inner}</span>` : '')}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`
    : `<div class="empty"><h2>No chores to schedule</h2><p class="muted">Add chores on the Chores &amp; pay tab first.</p></div>`;
  return `<div class="page-head"><div><h1>Weekly schedule</h1><p class="muted">${parent ? 'Tap a slot to choose who does that chore on that day, or to add or remove the day.' : 'Who does what each day. Your slots are outlined.'} "Anyone" means any child can do it and log the time.</p></div></div>
    <div class="stack">
      <div class="loads">${loads.map(l => `<div class="load">${avatar(l.k)}<div><b>${esc(l.k.name)}</b><span class="cap num">${dur(l.mins)} a week · ${money(l.pay)}</span></div></div>`).join('')}
        <div class="load"><span class="av" style="--c:var(--card);--t:var(--muted);border:1px dashed var(--line)" aria-hidden="true">?</span><div><b>Anyone</b><span class="cap num">${dur(openMins)} a week unassigned</span></div></div></div>
      ${grid}
    </div>`;
}

function viewBalances() {
  const parent = isParent();
  const kids = parent ? KIDS : [me()];
  const pays = Object.entries(S.payments).map(([id, p]) => ({ id, ...p })).filter(p => p && kids.some(k => k.id === p.childId)).sort((a, b) => String(b.paidAt).localeCompare(String(a.paidAt)));
  const cards = kids.map(k => {
    const t = totals(k.id);
    const unconfirmed = pays.filter(p => p.childId === k.id && !p.confirmedAt).length;
    return `<article class="kidcard">
      <header>${avatar(k)}<h2>${esc(k.name)}</h2>${unconfirmed ? `<span class="pill submitted">${unconfirmed} to confirm</span>` : ''}</header>
      <div class="owed"><span class="eyebrow">${t.balance < 0 ? 'Paid ahead' : 'Balance owed'}</span><b>${money(Math.abs(t.balance))}</b></div>
      <dl class="kv"><dt>Earned (approved)</dt><dd>${money(t.earned)}</dd><dt>Paid so far</dt><dd>${money(t.paid)}</dd><dt>Awaiting approval</dt><dd>${money(t.pending)}</dd><dt>Approved time</dt><dd>${dur(t.approvedMins)}</dd></dl>
      ${parent ? `<footer><button class="btn primary" data-act="pay" data-id="${k.id}">Record payment</button></footer>` : ''}
    </article>`;
  }).join('');
  const hist = pays.length ? `<div class="tbl-wrap"><table><thead><tr><th>Date</th>${parent ? '<th>Child</th>' : ''}<th class="r">Amount</th><th>Method</th><th>Paid by</th><th>Status</th><th></th></tr></thead><tbody>
    ${pays.map(p => {
      const mine = !parent && me().id === p.childId;
      const st = p.confirmedAt ? `<span class="pill approved">Received</span>` : `<span class="pill submitted">Awaiting confirmation</span>`;
      const act = !p.confirmedAt ? (mine ? `<button class="btn go sm" data-act="confirm-pay" data-id="${p.id}">Confirm received</button>` : (parent ? `<button class="btn ghost sm" data-act="del-pay" data-id="${p.id}">Remove</button>` : '')) : '';
      return `<tr><td>${fmtDate(p.date || String(p.paidAt).slice(0, 10))}</td>${parent ? `<td>${esc((member(p.childId) || {}).name)}</td>` : ''}<td class="r"><b>${money(p.amount)}</b></td><td>${esc(p.method)}${p.note ? `<br><span class="cap">${esc(p.note)}</span>` : ''}</td><td>${esc((member(p.paidBy) || {}).name || '')}</td><td>${st}</td><td class="r">${act}</td></tr>`;
    }).join('')}</tbody></table></div>`
    : `<div class="empty"><h2>No payments yet</h2><p class="muted">${parent ? 'Use Record payment on a child\'s card when you pay them. They confirm it here when they get it.' : 'When Mother or Father pay you, it shows here so you can confirm you got it.'}</p></div>`;
  // weekly history (approved pay by week) for the visible children
  const weeks = {};
  allEntries().filter(e => e.status === 'approved' && kids.some(k => k.id === e.childId)).forEach(e => {
    const k = e.week; weeks[k] = weeks[k] || { mins: 0, amt: 0, by: {} };
    weeks[k].mins += e.minutes; weeks[k].amt += e.amount; weeks[k].by[e.childId] = (weeks[k].by[e.childId] || 0) + e.amount;
  });
  const wk = Object.keys(weeks).sort().reverse().slice(0, 8);
  const weekTbl = wk.length ? `<section class="stack" style="gap:10px"><h2>Approved pay by week</h2><div class="tbl-wrap"><table><thead><tr><th>Week</th>${parent ? KIDS.map(k => `<th class="r">${esc(k.name)}</th>`).join('') : '<th class="r">Time</th>'}<th class="r">Total</th></tr></thead><tbody>
    ${wk.map(w => `<tr><td>${fmtRange(w)}</td>${parent ? KIDS.map(k => `<td class="r">${weeks[w].by[k.id] ? money(weeks[w].by[k.id]) : '<span class="muted">–</span>'}</td>`).join('') : `<td class="r">${dur(weeks[w].mins)}</td>`}<td class="r"><b>${money(weeks[w].amt)}</b></td></tr>`).join('')}
    </tbody></table></div></section>` : '';
  return `<div class="page-head"><div><h1>${parent ? 'Balances' : 'My balance'}</h1><p class="muted">Balance = approved chore pay minus payments made.${parent ? ' Record each payment so the children can confirm it.' : ''}</p></div></div>
    <div class="stack"><div class="kids">${cards}</div><section class="stack" style="gap:10px"><h2>Payments</h2>${hist}</section>${weekTbl}</div>`;
}

/* ---------- Modals ---------- */
let modalCleanup = null;
function openModal(title, bodyHtml, mount) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle"><header><h2 id="mtitle">${title}</h2><button class="btn ghost icon" data-act="close" aria-label="Close">✕</button></header>${bodyHtml}</div></div>`;
  const sheet = $('.sheet', root);
  if (mount) mount(sheet);
  const first = sheet.querySelector('input:not([type=hidden]), select, textarea, .opt');
  if (first) setTimeout(() => first.focus(), 30);
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
document.addEventListener('mousedown', e => { if (e.target.matches && e.target.matches('[data-scrim]')) closeModal(); });

function entryModal({ childId, date, choreId, minutes, sid, eid }) {
  const parent = isParent();
  const existing = eid ? S.sheets[sid].entries[eid] : null;
  if (existing) { childId = S.sheets[sid].childId; date = existing.date; choreId = existing.choreId; minutes = existing.minutes; }
  const w = existing ? S.sheets[sid].week : UI.week, t = today();
  if (!date) date = (t >= w && t <= addDays(w, 6)) ? t : (w < t ? addDays(w, 6) : w);
  const cs = activeChores();
  if (existing && !cs.some(c => c.id === choreId)) cs.push({ id: choreId, name: existing.choreName, rate: existing.rate });
  if (!cs.length) { toast('There are no chores yet. A parent needs to add them first.'); return; }
  if (!choreId) choreId = cs[0].id;
  const c0 = cs.find(c => c.id === choreId);
  if (minutes == null) minutes = c0 && c0.days ? sessionMins(c0) || 30 : 30;
  const kid = member(childId);
  const chips = [15, 30, 45, 60, 90, 120, 180];
  const body = `<form id="ef" novalidate>
    <p class="muted">${avatar(kid, 'sm')} <b style="color:var(--heading)">${esc(kid.name)}</b> · week of ${fmtRange(w)}</p>
    <label class="field"><span>Chore</span><select id="ef-chore">${cs.map(c => `<option value="${c.id}" ${c.id === choreId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
    <label class="field"><span>Day</span><select id="ef-date">${DAYS.map((d, i) => { const dd = addDays(w, i); const dis = dd > t && !parent; return `<option value="${dd}" ${dd === date ? 'selected' : ''} ${dis ? 'disabled' : ''}>${DAYS_LONG[i]} ${fmtDate(dd)}${dis ? ' (not yet)' : ''}</option>`; }).join('')}</select></label>
    <div class="field"><span>Time spent</span>
      <div class="chips" id="ef-chips">${chips.map(m => `<button type="button" class="chip" data-m="${m}">${dur(m)}</button>`).join('')}</div>
      <div class="row2"><label class="field"><small>Hours</small><input type="number" id="ef-h" min="0" max="16" step="1" inputmode="numeric"></label>
      <label class="field"><small>Minutes</small><select id="ef-m">${Array.from({ length: 12 }, (_, i) => i * 5).map(m => `<option value="${m}">${pad(m)}</option>`).join('')}</select></label></div>
    </div>
    <label class="field"><span>Note <small>(optional)</small></span><input type="text" id="ef-note" maxlength="140" placeholder="e.g. Also washed the mats" value="${esc(existing ? existing.note : '')}"></label>
    <div class="preview"><span class="muted num" id="ef-calc"></span><b class="num" id="ef-pay"></b></div>
    <p class="err" id="ef-err" hidden></p>
    <div class="sheet-actions">${existing ? `<button type="button" class="btn warn left" id="ef-del">Delete</button>` : ''}<button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">${existing ? 'Save' : (parent ? 'Add approved time' : 'Submit for approval')}</button></div>
  </form>`;
  openModal(existing ? 'Edit chore time' : 'Log chore time', body, sheet => {
    const H = $('#ef-h', sheet), M = $('#ef-m', sheet), C = $('#ef-chore', sheet);
    let mins = minutes;
    const setM = v => { mins = Math.max(0, Math.round(v / 5) * 5); H.value = Math.floor(mins / 60); M.value = String(mins % 60); upd(); };
    const upd = () => {
      const c = cs.find(x => x.id === C.value);
      const rate = existing && C.value === existing.choreId ? existing.rate : choreRate(c);
      $('#ef-calc', sheet).textContent = `${dur(mins)} × ${money(rate)}/hr`;
      $('#ef-pay', sheet).textContent = money(r2(mins / 60 * rate));
      sheet.querySelectorAll('#ef-chips .chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.m === mins)));
    };
    setM(mins);
    $('#ef-chips', sheet).addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) setM(+b.dataset.m); });
    H.addEventListener('input', () => { mins = Math.max(0, (parseInt(H.value, 10) || 0)) * 60 + (+M.value); upd(); });
    M.addEventListener('change', () => { mins = Math.max(0, (parseInt(H.value, 10) || 0)) * 60 + (+M.value); upd(); });
    C.addEventListener('change', upd);
    const del = $('#ef-del', sheet);
    if (del) del.addEventListener('click', async () => { closeModal(); if (await ops.removeEntry(sid, eid)) toast('Entry deleted'); });
    $('#ef', sheet).addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#ef-err', sheet);
      if (mins <= 0) { err.textContent = 'Enter the time spent, more than 0 minutes.'; err.hidden = false; return; }
      if (mins > 16 * 60) { err.textContent = 'That is more than 16 hours. Check the hours.'; err.hidden = false; return; }
      const c = cs.find(x => x.id === C.value);
      const rate = existing && C.value === existing.choreId ? existing.rate : r2(choreRate(c) * 10000) / 10000;
      const d = $('#ef-date', sheet).value;
      const base = { choreId: c.id, choreName: c.name, date: d, minutes: mins, rate, amount: r2(mins / 60 * rate), note: $('#ef-note', sheet).value.trim() };
      closeModal();
      if (existing) {
        const patch = { ...base, editedBy: UI.me, editedAt: new Date().toISOString() };
        if (existing.status === 'rejected' && !parent) patch.status = 'submitted';
        if (await ops.patchEntry(sid, eid, patch)) toast('Saved');
      } else {
        const now = new Date().toISOString();
        const entry = { ...base, status: parent ? 'approved' : 'submitted', createdBy: UI.me, createdAt: now, reviewedBy: parent ? UI.me : null, reviewedAt: parent ? now : null };
        if (await ops.putEntry(childId, weekOf(d), uid('e'), entry)) toast(parent ? 'Time added and approved' : 'Sent to Mother & Father for approval');
      }
    });
  });
}

function choreModal(id) {
  const c = id ? { ...S.chores[id] } : { name: '', hoursPerWeek: 2, frequency: 'Alternate day', days: FREQ['Alternate day'].slice(), assign: {}, rate: null, active: true };
  const body = `<form id="cf" novalidate>
    <label class="field"><span>Chore name</span><input type="text" id="cf-name" maxlength="60" value="${esc(c.name)}" placeholder="e.g. Take out the bins" required></label>
    <div class="row2">
      <label class="field"><span>Hours per week</span><input type="number" id="cf-hrs" min="0.25" step="0.25" value="${esc(c.hoursPerWeek)}"></label>
      <label class="field"><span>Activity</span><select id="cf-freq">${[...Object.keys(FREQ), 'Custom'].map(f => `<option ${f === (c.frequency || freqFor(c.days)) ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
    </div>
    <fieldset class="field" style="border:0;padding:0;margin:0"><legend style="font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px">Days</legend>
      <div class="daypick">${DAYS.map((d, i) => `<label><input type="checkbox" value="${i}" ${(c.days || []).includes(i) ? 'checked' : ''}>${d}</label>`).join('')}</div></fieldset>
    <label class="field"><span>Own hourly rate <small>(optional)</small></span><input type="number" id="cf-rate" min="0" step="0.01" value="${+c.rate > 0 ? esc(c.rate) : ''}" placeholder="Family rate ${num(familyRate())}"><small>Leave blank to use the family rate. Use it for chores that should pay more or less.</small></label>
    <div class="preview"><span class="muted num" id="cf-calc"></span><b class="num" id="cf-pay"></b></div>
    <p class="err" id="cf-err" hidden></p>
    <div class="sheet-actions">${id ? '<button type="button" class="btn warn left" id="cf-arch">Archive</button>' : ''}<button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">${id ? 'Save chore' : 'Add chore'}</button></div>
  </form>`;
  openModal(id ? 'Edit chore' : 'New chore', body, sheet => {
    const F = $('#cf-freq', sheet), boxes = [...sheet.querySelectorAll('.daypick input')];
    const days = () => boxes.filter(b => b.checked).map(b => +b.value);
    const upd = () => {
      const h = +$('#cf-hrs', sheet).value || 0, rt = +$('#cf-rate', sheet).value > 0 ? +$('#cf-rate', sheet).value : familyRate();
      const n = days().length;
      $('#cf-calc', sheet).textContent = `${hrs(h)} hrs × ${money(rt)}/hr${n ? ` · ${dur(Math.round(h * 60 / n / 5) * 5)} × ${n} days` : ''}`;
      $('#cf-pay', sheet).textContent = money(r2(h * rt)) + ' /wk';
    };
    F.addEventListener('change', () => { if (FREQ[F.value]) boxes.forEach(b => { b.checked = FREQ[F.value].includes(+b.value); }); upd(); });
    boxes.forEach(b => b.addEventListener('change', () => { F.value = freqFor(days()); upd(); }));
    ['#cf-hrs', '#cf-rate'].forEach(s => $(s, sheet).addEventListener('input', upd));
    upd();
    const arch = $('#cf-arch', sheet);
    if (arch) arch.addEventListener('click', async () => { closeModal(); if (await ops.putChore(id, { ...S.chores[id], active: false })) toast(`${c.name} archived`); });
    $('#cf', sheet).addEventListener('submit', async e => {
      e.preventDefault();
      const err = $('#cf-err', sheet), name = $('#cf-name', sheet).value.trim(), h = +$('#cf-hrs', sheet).value, d = days();
      if (!name) { err.textContent = 'Give the chore a name.'; err.hidden = false; return; }
      if (!(h > 0)) { err.textContent = 'Hours per week must be more than 0.'; err.hidden = false; return; }
      if (!d.length) { err.textContent = 'Pick at least one day.'; err.hidden = false; return; }
      const assign = {}; Object.entries(c.assign || {}).forEach(([k, v]) => { if (d.includes(+k) && v) assign[k] = v; });
      const rate = +$('#cf-rate', sheet).value > 0 ? r2(+$('#cf-rate', sheet).value) : null;
      const order = id ? (c.order || 0) : Math.max(0, ...Object.values(S.chores).map(x => x.order || 0)) + 1;
      closeModal();
      if (await ops.putChore(id || uid('c'), { name, hoursPerWeek: h, frequency: F.value, days: d, assign, rate, active: true, order })) toast(id ? 'Chore saved' : `${name} added`);
    });
  });
}

function rateModal() {
  const s = S.settings;
  const body = `<form id="rf" novalidate>
    <div class="field"><span>How the hourly rate is set</span>
      <div class="seg" role="group"><button type="button" data-mode="budget" aria-pressed="${s.rateMode !== 'manual'}">From monthly budget</button><button type="button" data-mode="manual" aria-pressed="${s.rateMode === 'manual'}">Fixed hourly rate</button></div></div>
    <div id="rf-budget" class="row2">
      <label class="field"><span>Monthly budget</span><input type="number" id="rf-month" min="0" step="1" value="${esc(s.monthlyBudget)}"></label>
      <label class="field"><span>Budgeted hours a week</span><input type="number" id="rf-hours" min="1" step="0.5" value="${esc(s.budgetHours)}"></label>
    </div>
    <label class="field" id="rf-manual-f"><span>Hourly rate</span><input type="number" id="rf-rate" min="0" step="0.01" value="${esc(s.manualRate)}"></label>
    <div class="preview"><span class="muted num" id="rf-calc"></span><b class="num" id="rf-out"></b></div>
    <div class="row2">
      <label class="field"><span>Currency symbol <small>(optional)</small></span><input type="text" id="rf-cur" maxlength="4" value="${esc(s.currency)}" placeholder="e.g. £ or SAR"></label>
      <label class="field"><span>Parent PIN <small>(optional)</small></span><input type="password" id="rf-pin" inputmode="numeric" maxlength="6" value="${esc(s.parentPin)}" placeholder="None"><small>Asked when someone picks Mother or Father.</small></label>
    </div>
    <p class="cap">Changing the rate affects new time only. Time already logged keeps the rate it was logged at.</p>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Save pay settings</button></div>
  </form>`;
  openModal('Pay settings', body, sheet => {
    let mode = s.rateMode === 'manual' ? 'manual' : 'budget';
    const upd = () => {
      sheet.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
      $('#rf-budget', sheet).hidden = mode !== 'budget'; $('#rf-manual-f', sheet).hidden = mode !== 'manual';
      const mb = +$('#rf-month', sheet).value || 0, bh = +$('#rf-hours', sheet).value || 0;
      const wk = mb * 12 / 52;
      if (mode === 'budget') { $('#rf-calc', sheet).textContent = `${num(mb)}/month → ${num(wk)}/wk ÷ ${hrs(bh)} hrs`; $('#rf-out', sheet).textContent = `${num(bh ? wk / bh : 0)} /hr`; }
      else { $('#rf-calc', sheet).textContent = 'Fixed rate'; $('#rf-out', sheet).textContent = `${num(+$('#rf-rate', sheet).value || 0)} /hr`; }
    };
    sheet.querySelector('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { mode = b.dataset.mode; upd(); } });
    sheet.querySelectorAll('input').forEach(i => i.addEventListener('input', upd));
    upd();
    $('#rf', sheet).addEventListener('submit', async e => {
      e.preventDefault();
      const patch = { rateMode: mode, monthlyBudget: Math.max(0, +$('#rf-month', sheet).value || 0), budgetHours: Math.max(1, +$('#rf-hours', sheet).value || 1), manualRate: Math.max(0, r2(+$('#rf-rate', sheet).value || 0)), currency: $('#rf-cur', sheet).value.trim(), parentPin: $('#rf-pin', sheet).value.trim() };
      closeModal();
      if (await ops.setSettings(patch)) toast('Pay settings saved');
    });
  });
}

function slotModal(id, day) {
  const c = S.chores[id]; const on = (c.days || []).includes(day); const cur = on ? ((c.assign || {})[day] || '') : 'off';
  const opt = (val, label, m) => `<button type="button" class="opt" data-v="${val}" aria-pressed="${cur === val}">${m ? avatar(m) : `<span class="av" style="--c:var(--raised);--t:var(--muted)" aria-hidden="true">${val === 'off' ? '–' : '?'}</span>`}${label}</button>`;
  const body = `<div class="sheet-body"><p class="muted">${esc(c.name)} · ${DAYS_LONG[day]} · ${dur(sessionMins({ ...c, days: on ? c.days : [...(c.days || []), day] }))} a session</p>
    <div class="optlist">${KIDS.map(k => opt(k.id, esc(k.name), k)).join('')}${opt('', 'Anyone')}${opt('off', 'Not on ' + DAYS_LONG[day])}</div></div>`;
  openModal('Who does this?', body, sheet => {
    sheet.querySelector('.optlist').addEventListener('click', async e => {
      const b = e.target.closest('.opt'); if (!b) return;
      const v = b.dataset.v; let days = [...(c.days || [])]; const assign = { ...(c.assign || {}) };
      if (v === 'off') {
        if (days.length <= 1 && days.includes(day)) { toast('A chore needs at least one day. Archive it on Chores & pay instead.'); return; }
        days = days.filter(d => d !== day); delete assign[day];
      } else {
        if (!days.includes(day)) days.push(day);
        if (v) assign[day] = v; else delete assign[day];
      }
      days.sort();
      closeModal();
      await ops.putChore(id, { ...c, days, assign, frequency: freqFor(days) });
    });
  });
}

function payModal(kid) {
  const k = member(kid), t = totals(kid);
  const body = `<form id="pf" novalidate>
    <p class="muted">${avatar(k, 'sm')} <b style="color:var(--heading)">${esc(k.name)}</b> · balance owed <b class="num" style="color:var(--heading)">${money(t.balance)}</b></p>
    <div class="row2">
      <label class="field"><span>Amount</span><input type="number" id="pf-amt" min="0.01" step="0.01" value="${t.balance > 0 ? t.balance.toFixed(2) : ''}"></label>
      <label class="field"><span>Date</span><input type="date" id="pf-date" value="${today()}"></label>
    </div>
    <label class="field"><span>Method</span><select id="pf-method"><option>Cash</option><option>Bank transfer</option><option>Savings account</option><option>Other</option></select></label>
    <label class="field"><span>Note <small>(optional)</small></span><input type="text" id="pf-note" maxlength="140" placeholder="e.g. Pay for weeks 46–47"></label>
    <p class="err" id="pf-err" hidden></p>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Record payment</button></div>
  </form>`;
  openModal('Record payment', body, sheet => {
    $('#pf', sheet).addEventListener('submit', async e => {
      e.preventDefault();
      const amt = r2(+$('#pf-amt', sheet).value);
      if (!(amt > 0)) { const er = $('#pf-err', sheet); er.textContent = 'Enter an amount more than 0.'; er.hidden = false; return; }
      const data = { childId: kid, amount: amt, date: $('#pf-date', sheet).value || today(), method: $('#pf-method', sheet).value, note: $('#pf-note', sheet).value.trim(), paidBy: UI.me, paidAt: new Date().toISOString(), confirmedAt: null };
      closeModal();
      if (await ops.putPayment(uid('p'), data)) toast(`Payment recorded. ${k.name} can confirm it on their balance page.`);
    });
  });
}

function confirmModal(title, text, label, fn) {
  openModal(title, `<div class="sheet-body"><p>${text}</p><div class="sheet-actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="button" class="btn warn" id="cm-ok">${label}</button></div></div>`, sheet => {
    $('#cm-ok', sheet).addEventListener('click', () => { closeModal(); fn(); });
  });
}

function pinModal(id) {
  const m = member(id);
  openModal(`Enter the parent PIN`, `<form id="pin" class="" novalidate><p class="muted">${avatar(m, 'sm')} ${esc(m.name)}</p><input type="password" id="pin-v" class="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN"><p class="err" id="pin-err" hidden>That PIN is not right.</p><div class="sheet-actions"><button type="button" class="btn ghost" data-act="close">Cancel</button><button type="submit" class="btn primary">Continue</button></div></form>`, sheet => {
    $('#pin', sheet).addEventListener('submit', e => {
      e.preventDefault();
      if ($('#pin-v', sheet).value.trim() === String(S.settings.parentPin)) { closeModal(); setMe(id); }
      else { $('#pin-err', sheet).hidden = false; $('#pin-v', sheet).select(); }
    });
  });
}

function setMe(id) {
  UI.me = id; lsSet('cm-me', id);
  const m = member(id);
  location.hash = m.role === 'parent' ? 'approvals' : 'my-week';
  render(); window.scrollTo(0, 0);
}

/* ---------- Actions ---------- */
const A = {
  close: closeModal,
  pick: d => { const m = member(d.id); if (m.role === 'parent' && S.settings.parentPin) pinModal(d.id); else setMe(d.id); },
  switch: () => { UI.me = null; lsSet('cm-me', null); history.replaceState(null, '', location.pathname + location.search); render(); },
  week: d => { const s = +d.step; UI.week = s === 0 ? weekOf(today()) : addDays(UI.week, 7 * s); render(); },
  kid: d => { UI.kid = d.id; render(); },
  'add-entry': d => entryModal({ childId: isParent() ? (UI.kid || KIDS[0].id) : UI.me, date: d.date }),
  log: d => { const c = S.chores[d.chore]; entryModal({ childId: isParent() ? (UI.kid || KIDS[0].id) : UI.me, date: d.date, choreId: d.chore, minutes: sessionMins(c) }); },
  'edit-entry': d => entryModal({ sid: d.sid, eid: d.eid }),
  approve: async d => { if (await ops.patchEntry(d.sid, d.eid, { status: 'approved', reviewedBy: UI.me, reviewedAt: new Date().toISOString() })) toast('Approved'); },
  reject: d => { const e = S.sheets[d.sid].entries[d.eid]; confirmModal('Reject this time?', `${esc(member(S.sheets[d.sid].childId).name)} logged ${dur(e.minutes)} of ${esc(e.choreName)} on ${fmtDay(e.date)}. It will not be paid. They can edit and resend it.`, 'Reject', async () => { if (await ops.patchEntry(d.sid, d.eid, { status: 'rejected', reviewedBy: UI.me, reviewedAt: new Date().toISOString() })) toast('Marked as not approved'); }); },
  'approve-all': async d => {
    const es = allEntries().filter(e => e.childId === d.id && e.status === 'submitted'); const now = new Date().toISOString();
    let ok = true; for (const e of es) ok = (await ops.patchEntry(e.sid, e.eid, { status: 'approved', reviewedBy: UI.me, reviewedAt: now })) && ok;
    if (ok) toast(`Approved ${es.length} entr${es.length === 1 ? 'y' : 'ies'} for ${member(d.id).name}`);
  },
  'add-chore': () => choreModal(null),
  'edit-chore': d => choreModal(d.id),
  'restore-chore': async d => { if (await ops.putChore(d.id, { ...S.chores[d.id], active: true })) toast('Chore restored'); },
  'toggle-arch': () => { UI.showArchived = !UI.showArchived; render(); },
  seed: async () => { if (await ops.seedChores()) toast('Added the four spreadsheet chores'); },
  'edit-rate': rateModal,
  slot: d => slotModal(d.id, +d.day),
  pay: d => payModal(d.id),
  'confirm-pay': async d => { if (await ops.patchPayment(d.id, { confirmedAt: new Date().toISOString(), confirmedBy: UI.me })) toast('Thanks! Payment confirmed'); },
  'del-pay': d => { const p = S.payments[d.id]; confirmModal('Remove this payment?', `${money(p.amount)} to ${esc(member(p.childId).name)} on ${fmtDate(p.date)}. Their balance goes back up by this amount.`, 'Remove', async () => { if (await ops.removePayment(d.id)) toast('Payment removed'); }); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el.dataset, el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
}

boot();
})();
</script>
